<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>설교 관리 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; }
        h1, h2, h3, .serif { font-family: 'Noto Serif KR', serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-amber-50 to-orange-50 min-h-screen">
    <div class="min-h-screen">
        <!-- 헤더 -->
        <header class="bg-gradient-to-r from-amber-800 to-amber-700 shadow-lg">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-center py-5">
                    <div class="flex items-center space-x-3">
                        <svg class="w-9 h-9 text-amber-200" fill="currentColor" viewBox="0 0 24 24"><path d="M11 2v4H7v4h4v12h2V10h4V6h-4V2h-2z"/></svg>
                        <h1 class="text-2xl font-bold text-amber-50 serif">설교 관리 시스템</h1>
                    </div>
                    <div class="flex items-center space-x-4">
                        <span class="text-sm text-amber-200">포트: 9897</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- 메인 컨텐츠 -->
        <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
            <!-- 탭 네비게이션 -->
            <div class="flex space-x-3 mb-8 px-4 sm:px-0">
                <button id="tab1" class="tab-button px-5 py-2.5 rounded-full text-sm font-medium bg-amber-600 text-white shadow-md transition-all">
                    YouTube MP3 추출
                </button>
                <button id="tab2" class="tab-button px-5 py-2.5 rounded-full text-sm font-medium bg-amber-100 text-amber-800 hover:bg-amber-200 transition-all">
                    설교 게시판
                </button>
            </div>

            <!-- 탭 1: YouTube MP3 추출 -->
            <div id="tab1-content" class="tab-content">
                <div class="bg-white shadow-lg rounded-xl p-6 border border-amber-100">
                    <h2 class="text-xl font-semibold text-amber-900 mb-6 serif">YouTube에서 MP3 추출</h2>

                    <form id="extractForm" class="space-y-6">
                        <div>
                            <label for="youtubeUrl" class="block text-sm font-medium text-amber-800 mb-2">
                                교회 YouTube 링크
                            </label>
                            <input type="url" id="youtubeUrl" name="youtubeUrl" required
                                class="w-full px-3 py-2 border border-amber-200 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500 bg-amber-50/30"
                                placeholder="https://www.youtube.com/watch?v=...">
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label for="startTime" class="block text-sm font-medium text-amber-800 mb-2">
                                    시작 시간 (HH:MM:SS)
                                </label>
                                <input type="text" id="startTime" name="startTime" required
                                    class="w-full px-3 py-2 border border-amber-200 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500 bg-amber-50/30"
                                    placeholder="00:00:00">
                            </div>
                            <div>
                                <label for="endTime" class="block text-sm font-medium text-amber-800 mb-2">
                                    종료 시간 (HH:MM:SS)
                                </label>
                                <input type="text" id="endTime" name="endTime" required
                                    class="w-full px-3 py-2 border border-amber-200 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500 bg-amber-50/30"
                                    placeholder="00:00:00">
                            </div>
                        </div>

                        <div>
                            <label for="title" class="block text-sm font-medium text-amber-800 mb-2">
                                설교 제목 (선택사항)
                            </label>
                            <input type="text" id="title" name="title"
                                class="w-full px-3 py-2 border border-amber-200 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500 bg-amber-50/30"
                                placeholder="설교 제목을 입력하세요">
                        </div>

                        <div class="flex items-center justify-between">
                            <button type="submit"
                                class="bg-amber-600 hover:bg-amber-700 text-white font-medium py-2.5 px-6 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 focus:ring-offset-2 shadow-md transition-colors">
                                MP3 추출 시작
                            </button>
                            <div id="extractStatus" class="text-sm text-amber-700"></div>
                        </div>
                    </form>

                    <div id="extractResult" class="mt-6 hidden">
                        <div class="bg-amber-50 border border-amber-200 rounded-xl p-4">
                            <div class="flex">
                                <div class="flex-shrink-0">
                                    <svg class="h-5 w-5 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                </div>
                                <div class="ml-3">
                                    <h3 class="text-sm font-medium text-amber-800">추출 완료</h3>
                                    <div class="mt-2 text-sm text-amber-700">
                                        <p id="resultMessage"></p>
                                        <p id="resultFileName" class="mt-1"></p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 탭 2: 설교 게시판 -->
            <div id="tab2-content" class="tab-content hidden">
                <div class="bg-white shadow-lg rounded-xl border border-amber-100">
                    <!-- 게시판 헤더 -->
                    <div class="px-6 py-4 border-b border-amber-100">
                        <div class="flex justify-between items-center">
                            <h2 class="text-xl font-semibold text-amber-900 serif">설교 게시판</h2>
                            <button id="addSermonBtn"
                                class="bg-amber-600 hover:bg-amber-700 text-white font-medium py-2 px-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 focus:ring-offset-2 shadow-md transition-colors">
                                설교 추가
                            </button>
                        </div>
                    </div>

                    <!-- 설교 목록 테이블 -->
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-amber-100">
                            <thead class="bg-amber-50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-amber-700 uppercase tracking-wider">날짜</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-amber-700 uppercase tracking-wider">설교 제목</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-amber-700 uppercase tracking-wider">음성인식 텍스트</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-amber-700 uppercase tracking-wider">MP3</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-amber-700 uppercase tracking-wider">작업</th>
                                </tr>
                            </thead>
                            <tbody id="sermonTableBody" class="bg-white divide-y divide-amber-50">
                                <!-- 설교 목록이 여기에 동적으로 로드됩니다 -->
                            </tbody>
                        </table>
                    </div>

                    <!-- 페이지네이션 -->
                    <div id="pagination" class="px-6 py-4 border-t border-amber-100">
                        <!-- 페이지네이션이 여기에 동적으로 로드됩니다 -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 설교 추가/수정 모달 -->
    <div id="sermonModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm overflow-y-auto h-full w-full hidden z-50">
        <div class="relative top-20 mx-auto p-6 border border-amber-200 w-96 shadow-2xl rounded-xl bg-white">
            <div class="mt-3">
                <h3 id="modalTitle" class="text-lg font-medium text-amber-900 mb-4 serif">설교 추가</h3>
                <form id="sermonForm" class="space-y-4">
                    <input type="hidden" id="sermonId" name="sermonId">

                    <div>
                        <label for="modalTitle" class="block text-sm font-medium text-amber-800 mb-1">설교 제목</label>
                        <input type="text" id="modalTitleInput" name="modalTitle" required
                            class="w-full px-3 py-2 border border-amber-200 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500">
                    </div>

                    <div>
                        <label for="modalDate" class="block text-sm font-medium text-amber-800 mb-1">날짜</label>
                        <input type="date" id="modalDate" name="modalDate" required
                            class="w-full px-3 py-2 border border-amber-200 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500">
                    </div>

                    <div>
                        <label for="modalMp3File" class="block text-sm font-medium text-amber-800 mb-1">MP3 파일</label>
                        <input type="text" id="modalMp3File" name="modalMp3File" required
                            class="w-full px-3 py-2 border border-amber-200 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500"
                            placeholder="MP3 파일 경로 또는 URL">
                    </div>

                    <div>
                        <label for="modalTxtFile" class="block text-sm font-medium text-amber-800 mb-1">음성인식 텍스트 파일</label>
                        <input type="text" id="modalTxtFile" name="modalTxtFile" required
                            class="w-full px-3 py-2 border border-amber-200 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500"
                            placeholder="텍스트 파일 경로 또는 URL">
                    </div>

                    <div class="flex justify-end space-x-3 pt-4">
                        <button type="button" id="cancelBtn"
                            class="bg-amber-100 hover:bg-amber-200 text-amber-800 font-medium py-2 px-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 focus:ring-offset-2 transition-colors">
                            취소
                        </button>
                        <button type="submit"
                            class="bg-amber-600 hover:bg-amber-700 text-white font-medium py-2 px-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 focus:ring-offset-2 shadow-md transition-colors">
                            저장
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
