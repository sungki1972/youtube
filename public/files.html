<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP3 파일 목록</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; }
        h1, h2, h3, .serif { font-family: 'Noto Serif KR', serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-amber-50 to-orange-50 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <div class="max-w-6xl mx-auto">
            <!-- 헤더 -->
            <div class="flex items-center space-x-3 mb-6">
                <svg class="w-8 h-8 text-amber-700" fill="currentColor" viewBox="0 0 24 24"><path d="M11 2v4H7v4h4v12h2V10h4V6h-4V2h-2z"/></svg>
                <h1 class="text-2xl font-bold text-amber-900 serif">MP3 파일 목록</h1>
            </div>

            <div class="bg-white rounded-xl shadow-lg p-6 border border-amber-100">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-semibold text-amber-800 serif">생성된 MP3 파일 목록</h2>
                    <div class="flex space-x-2">
                        <button onclick="refreshFiles()"
                                class="bg-amber-600 text-white px-4 py-2 rounded-lg hover:bg-amber-700 shadow-md transition-colors">
                            새로고침
                        </button>
                        <a href="/api.html"
                           class="bg-amber-100 text-amber-800 px-4 py-2 rounded-lg hover:bg-amber-200 transition-colors">
                            새 MP3 생성
                        </a>
                    </div>
                </div>

                <div id="loading" class="text-center py-8">
                    <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-amber-600"></div>
                    <p class="mt-2 text-amber-700">파일 목록을 불러오는 중...</p>
                </div>

                <div id="fileList" class="hidden">
                    <div id="fileCount" class="mb-4 text-sm text-amber-700"></div>
                    <div class="overflow-x-auto">
                        <table class="min-w-full table-auto">
                            <thead class="bg-amber-50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-amber-700 uppercase tracking-wider">파일명</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-amber-700 uppercase tracking-wider">크기</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-amber-700 uppercase tracking-wider">생성일시</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-amber-700 uppercase tracking-wider">다운로드</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-amber-700 uppercase tracking-wider">재생</th>
                                </tr>
                            </thead>
                            <tbody id="fileTableBody" class="bg-white divide-y divide-amber-50">
                                <!-- 파일 목록이 여기에 추가됩니다 -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <div id="noFiles" class="text-center py-8 hidden">
                    <p class="text-amber-600">생성된 MP3 파일이 없습니다.</p>
                    <a href="/api.html" class="mt-4 inline-block bg-amber-600 text-white px-6 py-2 rounded-lg hover:bg-amber-700 shadow-md transition-colors">
                        첫 MP3 생성하기
                    </a>
                </div>

                <div id="error" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl hidden">
                    <p id="errorMessage">파일 목록을 불러오는 중 오류가 발생했습니다.</p>
                </div>
            </div>

            <!-- 다운로드 통계 -->
            <div class="mt-6 bg-white rounded-xl shadow-lg p-6 border border-amber-100">
                <h2 class="text-lg font-semibold mb-4 text-amber-900 serif">통계</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="bg-amber-50 p-4 rounded-xl border border-amber-100">
                        <div class="text-2xl font-bold text-amber-700" id="totalFiles">0</div>
                        <div class="text-sm text-amber-600">총 파일 수</div>
                    </div>
                    <div class="bg-orange-50 p-4 rounded-xl border border-orange-100">
                        <div class="text-2xl font-bold text-orange-700" id="totalSize">0 MB</div>
                        <div class="text-sm text-orange-600">총 파일 크기</div>
                    </div>
                    <div class="bg-yellow-50 p-4 rounded-xl border border-yellow-100">
                        <div class="text-2xl font-bold text-yellow-700" id="latestFile">-</div>
                        <div class="text-sm text-yellow-600">최근 생성</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentAudio = null;

        // 페이지 로드 시 파일 목록 불러오기
        document.addEventListener('DOMContentLoaded', function() {
            loadFiles();
        });

        // 파일 목록 로드 (로컬 파일 + Supabase 데이터 통합)
        async function loadFiles() {
            try {
                showLoading();

                // 로컬 파일 목록과 Supabase 설교 목록 동시 로드
                const [filesResponse, sermonsResponse] = await Promise.all([
                    fetch('/api/files'),
                    fetch('/api/sermons?page=1&limit=100')
                ]);

                const filesData = await filesResponse.json();
                const sermonsData = await sermonsResponse.json();

                if (filesData.success) {
                    // 로컬 파일과 Supabase 데이터 통합
                    const combinedFiles = [...filesData.files];

                    // Supabase 설교 데이터 추가
                    if (sermonsData.sermons) {
                        sermonsData.sermons.forEach(sermon => {
                            // 로컬에 없는 외부 MP3 파일 추가
                            if (sermon.mp3_file && !sermon.mp3_file.includes('/uploads/')) {
                                combinedFiles.push({
                                    fileName: sermon.title + '.mp3',
                                    downloadUrl: sermon.mp3_file,
                                    fileSize: 0,
                                    createdAt: sermon.date,
                                    modifiedAt: sermon.date,
                                    isExternal: true,
                                    sermonData: sermon
                                });
                            }
                        });
                    }

                    displayFiles(combinedFiles);
                    updateStatistics(combinedFiles);
                } else {
                    showError('파일 목록을 불러올 수 없습니다.');
                }
            } catch (error) {
                console.error('Error:', error);
                showError('네트워크 오류가 발생했습니다.');
            }
        }

        // 파일 목록 표시
        function displayFiles(files) {
            const loadingDiv = document.getElementById('loading');
            const fileListDiv = document.getElementById('fileList');
            const noFilesDiv = document.getElementById('noFiles');
            const errorDiv = document.getElementById('error');
            const fileTableBody = document.getElementById('fileTableBody');
            const fileCountDiv = document.getElementById('fileCount');

            loadingDiv.classList.add('hidden');
            errorDiv.classList.add('hidden');

            if (files.length === 0) {
                fileListDiv.classList.add('hidden');
                noFilesDiv.classList.remove('hidden');
                return;
            }

            noFilesDiv.classList.add('hidden');
            fileListDiv.classList.remove('hidden');

            fileCountDiv.textContent = `총 ${files.length}개의 MP3 파일`;

            fileTableBody.innerHTML = '';

            files.forEach(file => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-amber-50/50 transition-colors';

                const fileName = file.fileName.length > 50 ?
                    file.fileName.substring(0, 50) + '...' : file.fileName;

                const fileSize = file.isExternal ? 'External' : (file.fileSize / 1024 / 1024).toFixed(2) + ' MB';
                const createdDate = new Date(file.createdAt).toLocaleString('ko-KR');
                const fileType = file.isExternal ?
                    '<span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-amber-100 text-amber-800">Supabase</span>' :
                    '<span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-orange-100 text-orange-800">Local</span>';

                row.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-amber-900" title="${file.fileName}">
                        <div class="flex items-center">
                            ${fileName}
                            <div class="ml-2">${fileType}</div>
                        </div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-amber-800">
                        ${fileSize}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-amber-800">
                        ${createdDate}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                        <a href="${file.downloadUrl}" download="${file.fileName}"
                           class="inline-flex items-center px-3 py-1.5 bg-amber-600 text-white rounded-lg hover:bg-amber-700 shadow-sm transition-colors">
                            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                            </svg>
                            다운로드
                        </a>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                        <button onclick="togglePlay('${file.downloadUrl}', this)"
                                class="inline-flex items-center px-3 py-1.5 bg-orange-600 text-white rounded-lg hover:bg-orange-700 shadow-sm transition-colors">
                            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h1.586a1 1 0 01.707.293l2.414 2.414a1 1 0 00.707.293H15M9 10V9a1 1 0 011-1h4a1 1 0 011 1v1M9 10v5a1 1 0 001 1h4a1 1 0 001-1v-5m-4 0V8a1 1 0 011-1h2a1 1 0 011 1v2"></path>
                            </svg>
                            재생
                        </button>
                    </td>
                `;

                fileTableBody.appendChild(row);
            });
        }

        // 통계 업데이트
        function updateStatistics(files) {
            const totalFiles = files.length;
            const totalSize = files.reduce((sum, file) => sum + file.fileSize, 0);
            const latestFile = files.length > 0 ?
                new Date(files[0].createdAt).toLocaleDateString('ko-KR') : '-';

            document.getElementById('totalFiles').textContent = totalFiles;
            document.getElementById('totalSize').textContent = (totalSize / 1024 / 1024).toFixed(2) + ' MB';
            document.getElementById('latestFile').textContent = latestFile;
        }

        // MP3 재생/정지
        function togglePlay(url, button) {
            if (currentAudio && !currentAudio.paused) {
                currentAudio.pause();
                resetAllPlayButtons();
                return;
            }

            if (currentAudio) {
                currentAudio.pause();
                resetAllPlayButtons();
            }

            currentAudio = new Audio(url);
            currentAudio.play().catch(error => {
                console.error('재생 오류:', error);
                alert('MP3 재생 중 오류가 발생했습니다.');
            });

            button.innerHTML = `
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6"></path>
                </svg>
                정지
            `;

            currentAudio.onended = () => {
                resetAllPlayButtons();
            };
        }

        // 모든 재생 버튼 초기화
        function resetAllPlayButtons() {
            const playButtons = document.querySelectorAll('button[onclick*="togglePlay"]');
            playButtons.forEach(button => {
                button.innerHTML = `
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h1.586a1 1 0 01.707.293l2.414 2.414a1 1 0 00.707.293H15M9 10V9a1 1 0 011-1h4a1 1 0 011 1v1M9 10v5a1 1 0 001 1h4a1 1 0 001-1v-5m-4 0V8a1 1 0 011-1h2a1 1 0 011 1v2"></path>
                    </svg>
                    재생
                `;
            });
        }

        // 새로고침
        function refreshFiles() {
            loadFiles();
        }

        // 로딩 표시
        function showLoading() {
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('fileList').classList.add('hidden');
            document.getElementById('noFiles').classList.add('hidden');
            document.getElementById('error').classList.add('hidden');
        }

        // 오류 표시
        function showError(message) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('fileList').classList.add('hidden');
            document.getElementById('noFiles').classList.add('hidden');
            document.getElementById('error').classList.remove('hidden');
            document.getElementById('errorMessage').textContent = message;
        }
    </script>
</body>
</html>
